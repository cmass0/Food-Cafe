# 서버 여러 대 실험용 분배기. k6 요청을 앱 서버(내 PC에서 도는 next start)들에 나눠 보낸다.
# 서버 1대와 2대를 같은 분배기를 거쳐 비교해야 분배기 자체의 영향이 빠지므로, 포트를 둘로 나눴다.
#   3400 → 앱 서버 1대(3300)
#   3402 → 앱 서버 2대(3301·3302)
worker_processes auto;

events {
  # nginx 기본값 512로 두면 사용자 1,000명의 연결을 못 받아 Supabase 정문과 같은 문제가 난다.
  worker_connections 8192;
}

http {
  access_log off;

  # least_conn: 처리 중인 요청이 적은 서버로 보낸다. 페이지마다 처리 시간이 달라 단순 번갈아 보내기보다 고르다.
  # max_fails=0: nginx 기본값(max_fails=1)은 오류 한 번에 서버를 10초간 "죽은 서버"로 뺀다.
  #   첫 2대 실험에서 바빠서 생긴 오류 수십 건에 두 서버가 번갈아 빠지다 둘 다 빠져, 요청의 24%가 502가 됐다.
  #   여기서는 바쁨을 죽음으로 보지 않게 끈다(실서비스는 별도 상태 확인 주소로 진짜 죽었는지만 본다).
  # keepalive_timeout 4s: 앱 서버(Node)는 쉬는 연결을 5초 뒤 닫는다. 분배기가 먼저 닫아야
  #   막 닫힌 연결에 요청을 보내 "upstream prematurely closed"가 나는 일을 막는다.
  upstream one_app {
    server host.docker.internal:3300 max_fails=0;
    keepalive 128;
    keepalive_timeout 4s;
  }

  upstream two_apps {
    least_conn;
    server host.docker.internal:3301 max_fails=0;
    server host.docker.internal:3302 max_fails=0;
    keepalive 128;
    keepalive_timeout 4s;
  }

  server {
    listen 3400;
    location / {
      proxy_pass http://one_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
      # 응답 머리말에 실제로 처리한 앱 서버 주소를 붙인다(분배가 어떻게 되는지 눈으로 확인용).
      add_header X-Served-By $upstream_addr always;
    }
  }

  server {
    listen 3402;
    location / {
      proxy_pass http://two_apps;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_read_timeout 120s;
      # 응답 머리말에 실제로 처리한 앱 서버 주소를 붙인다(분배가 어떻게 되는지 눈으로 확인용).
      add_header X-Served-By $upstream_addr always;
    }
  }
}

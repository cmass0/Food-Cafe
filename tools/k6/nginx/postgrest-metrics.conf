# Supabase REST 서버(PostgREST)의 관리용 지표(rest:3001/metrics)를 Prometheus가 가져갈 수 있게 이어 준다.
# 주소를 요청 때마다 다시 찾는다(Supabase를 다시 켜면 REST 서버의 내부 주소가 바뀌기 때문).
server {
  listen 8080;
  resolver 127.0.0.11 valid=10s;

  location = /metrics {
    set $postgrest http://rest:3001;
    proxy_pass $postgrest/metrics;
  }
}

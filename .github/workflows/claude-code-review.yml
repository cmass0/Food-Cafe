name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  # 교차 리뷰: Claude와 함께 작성한 PR은 Codex가 리뷰하고, 그 외 PR은 Claude가 리뷰한다.
  # Claude가 만든 커밋에는 "Co-Authored-By: ... <noreply@anthropic.com>" 서명이 붙으므로,
  # PR 커밋 중 하나라도 이 서명이 있고 Codex 요청 토큰이 준비됐으면 Claude 자동 리뷰를 건너뛴다.
  # 필요하면 PR 댓글에서 @claude를 멘션해 수동으로 리뷰를 요청할 수 있다(claude.yml).
  check-authorship:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      claude_authored: ${{ steps.check.outputs.claude_authored }}
      codex_available: ${{ steps.token.outputs.codex_available }}
    steps:
      - name: Check for Claude co-authored commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          messages="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/commits" --paginate --jq '.[].commit.message')"
          if printf '%s\n' "$messages" | grep -qiE '^Co-Authored-By:.*<noreply@anthropic\.com>'; then
            echo "claude_authored=true" >> "$GITHUB_OUTPUT"
            echo "Claude 공동 작성 서명을 확인했습니다." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "claude_authored=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Codex review token
        id: token
        env:
          CODEX_REVIEW_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
        run: |
          if [ -n "$CODEX_REVIEW_TOKEN" ]; then
            echo "codex_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "codex_available=false" >> "$GITHUB_OUTPUT"
            echo "CODEX_REVIEW_TOKEN이 없어 Claude 리뷰를 대체 실행합니다." >> "$GITHUB_STEP_SUMMARY"
          fi

  claude-review:
    needs: [check-authorship, codex-review]
    if: ${{ !cancelled() && needs.codex-review.result != 'success' }}

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment" --append-system-prompt "GitHub PR 리뷰의 제목, 요약, 인라인 댓글을 한국어로 작성하세요. 코드, 식별자, 파일 경로, 심각도 표기는 그대로 유지하세요."'
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options

  codex-review:
    needs: check-authorship
    if: needs.check-authorship.outputs.claude_authored == 'true' && needs.check-authorship.outputs.codex_available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions: {}
    steps:
      - name: Request Codex review once per PR revision
        env:
          # Codex must see the comment from the GitHub account linked to Codex.
          # Use a fine-grained token limited to this repository with Pull requests: write.
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set CODEX_REVIEW_TOKEN to a token for the GitHub account linked to Codex."
            exit 1
          fi

          marker="<!-- codex-cross-review:${HEAD_SHA} -->"
          printf -v request_body '@codex review\n\n리뷰 제목, 요약, 인라인 댓글을 한국어로 작성해 주세요. 코드, 식별자, 파일 경로, 심각도 표기는 그대로 유지해 주세요.\n\n%s' "$marker"
          token_owner="$(gh api user --jq '.login')"
          existing="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate |
            jq -r --arg owner "$token_owner" --arg body "$request_body" \
              '.[] | select(.user.login == $owner and .body == $body) | .id')"
          if [ -n "$existing" ]; then
            echo "Codex review already requested for ${HEAD_SHA}." >> "$GITHUB_STEP_SUMMARY"
            comment_id="${existing%%$'\n'*}"
          else
            comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f "body=${request_body}" --jq '.id')"
          fi

          # Codex는 지적 사항이 있으면 PR 리뷰를, 없으면 "Reviewed commit: `<SHA 앞 10자리>`" 댓글이나 👍를 남긴다.
          reviewed_marker="**Reviewed commit:** \`${HEAD_SHA:0:10}\`"
          for attempt in {1..24}; do
            reviews="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate |
              jq -r --arg sha "$HEAD_SHA" \
                '.[] | select(.user.login == "chatgpt-codex-connector[bot]" and .commit_id == $sha and .state != "PENDING") | .id')"
            summaries="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate |
              jq -r --arg marker "$reviewed_marker" \
                '.[] | select(.user.login == "chatgpt-codex-connector[bot]" and (.body | contains($marker))) | .id')"
            approvals="$(gh api "repos/${REPO}/issues/comments/${comment_id}/reactions" --paginate |
              jq -r '.[] | select(.user.login == "chatgpt-codex-connector[bot]" and .content == "+1") | .id')"
            if [ -n "$reviews" ] || [ -n "$summaries" ] || [ -n "$approvals" ]; then
              echo "Codex completed review for ${HEAD_SHA}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done

          echo "::error::Codex did not complete the review within six minutes; running Claude review instead."
          exit 1

